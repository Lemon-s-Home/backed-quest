<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="800" height="320" fill="#ffffff"/>
  <rect x="270" y="120" width="260" height="80" fill="#d9dde3"/>
  <g stroke="#9aa3ad" stroke-width="4" stroke-dasharray="18 14"><line x1="270" y1="160" x2="530" y2="160"/></g>
  <rect x="30" y="90" width="210" height="140" rx="14" fill="#e8f1ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="135" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Клиент</text>
  <text x="135" y="155" text-anchor="middle" font-size="16" fill="#1e3a8a">твой браузер</text>
  <rect x="560" y="90" width="210" height="140" rx="14" fill="#fff1e6" stroke="#f97316" stroke-width="3"/>
  <text x="665" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#c2410c">Сервер</text>
  <text x="665" y="155" text-anchor="middle" font-size="16" fill="#7c2d12">компьютер с сайтом</text>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111827"/></marker></defs>
  <line x1="285" y1="110" x2="515" y2="110" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
  <text x="400" y="98" text-anchor="middle" font-size="18" fill="#111827">запрос: «дай страницу»</text>
  <line x1="515" y1="212" x2="285" y2="212" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
  <text x="400" y="240" text-anchor="middle" font-size="18" fill="#111827">ответ: страница</text>
  <text x="400" y="290" text-anchor="middle" font-size="16" fill="#6b7280">Первым всегда говорит клиент. Сервер только отвечает.</text>
</svg>
